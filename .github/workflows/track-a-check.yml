name: GamePort macOS verification
on:
  push:
    branches: [verify-track-a-macos]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: swift build -c release
      - name: Exercise recipes and config through the release CLI
        shell: python3 {0}
        run: |
          import json, os, pathlib, subprocess, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              env = dict(os.environ, GAMEPORT_HOME=tmp)
              def cli(*args, check=True):
                  return subprocess.run([".build/release/gameport", *args], env=env, capture_output=True, text=True, check=check)
              assert len(cli("recipes").stdout.splitlines()) == 21
              assert "Team Fortress 2" in cli("recipes", "440", "--status", "verified", "--renderer", "dxmt").stdout
              assert "No matching" in cli("recipes", "440", "--renderer", "dxvk").stdout
              assert cli("recipes", "--status", check=False).returncode == 1
              assert cli("recipes", "--other", check=False).returncode == 1
              manifest = json.loads(next(Path("Data/engines").glob("*.json")).read_text())
              engine = root / "engines" / manifest["id"]
              engine.mkdir(parents=True)
              receipt = next(line.split('"')[1] for line in Path("Sources/GamePortKit/Engine.swift").read_text().splitlines() if "static let receiptName" in line)
              (engine / receipt).write_text(json.dumps(manifest))
              for path in [manifest["wineLoader"], manifest["wineServer"]]:
                  bin = engine / path
                  bin.parent.mkdir(parents=True, exist_ok=True)
                  bin.write_text("#!/bin/sh\nexit 0\n")
                  bin.chmod(0o755)
              profile = root / "profiles" / "hogwarts-legacy"
              profile.mkdir(parents=True)
              (profile / "profile.json").write_text(json.dumps(dict(schema=1,id=profile.name,recipeID=profile.name,title="Hogwarts Legacy",engineID=manifest["id"],renderer="wined3d",environment={},metalHUD=False,createdAt="2026-11-01T00:00:00Z")))
              folder = profile / "prefix/drive_c/users" / env["USER"] / "AppData/Local/Hogwarts Legacy/Saved/Config/WindowsNoEditor"
              folder.mkdir(parents=True)
              ini = folder / "Engine.ini"
              ini.write_bytes(b"; custom\r\n[SystemSettings]\r\nGamma=2\r\n")
              first = cli("config", profile.name)
              assert "Added" in first.stdout, first
              assert ini.read_bytes() == b"; custom\r\n[SystemSettings]\r\nr.WarnOfBadDrivers=0\r\nGamma=2\r\n"
              assert "Kept" in cli("config", profile.name).stdout
              assert len(list(folder.glob("*.bak"))) == 1
              print("Catalog, filters, invalid arguments, and profile config retries passed.")
              recipe = json.loads(Path("Data/recipes/hogwarts-legacy.json").read_text())
              recipe["id"] = "registry-fixture"
              key = r"HKCU\Software\Wine\AppDefaults\gameport-fixture.exe\Mac Driver"
              recipe["configDefaults"] = {"registry": [
                  dict(key=key, name="PlayerSetting", type="REG_SZ", data="recipe"),
                  dict(key=key, name="MissingSetting", type="REG_DWORD", data="0xff")
              ]}
              db = root / "db/recipes"
              db.mkdir(parents=True)
              (db / "registry.json").write_text(json.dumps(recipe))
              profile_json = json.loads((profile / "profile.json").read_text())
              profile_json["recipeID"] = recipe["id"]
              (profile / "profile.json").write_text(json.dumps(profile_json))
              output = Path(os.environ["RUNNER_TEMP"]) / "gameport-registry.inf"
              (engine / manifest["wineLoader"]).write_text(
                  '#!/bin/sh\nset -eu\nif [ "$1" = rundll32.exe ]; then cp "$WINEPREFIX"/drive_c/gameport-*.inf "' + str(output) + '"; fi\n')
              cli("config", profile.name)
              assert output.exists()
              assert not list((profile / "prefix/drive_c").glob("gameport-*.inf"))
      - uses: actions/upload-artifact@v4
        with:
          name: registry-fixture
          path: ${{ runner.temp }}/gameport-registry.inf
  wine-registry:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-fixture
      - name: Install Wine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine64 xvfb xauth
      - name: Apply the CLI-generated defaults twice in a disposable Wine prefix
        env:
          WINEPREFIX: ${{ runner.temp }}/wine
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          xvfb-run -a bash -euo pipefail <<'SH'
          wine=/usr/lib/wine/wine64
          key='HKCU\Software\Wine\AppDefaults\gameport-fixture.exe\Mac Driver'
          "$wine" wineboot -u
          cp gameport-registry.inf "$WINEPREFIX/drive_c/recipe.inf"
          "$wine" reg add "$key" /v PlayerSetting /t REG_SZ /d player /f
          for pass in 1 2; do
            "$wine" rundll32.exe setupapi.dll,InstallHinfSection DefaultInstall 128 'C:\recipe.inf'
            "$wine" reg query "$key" /v PlayerSetting | grep -Ei 'REG_SZ[[:space:]]+player'
            "$wine" reg query "$key" /v MissingSetting | grep -Ei 'REG_DWORD[[:space:]]+0xff'
          done
          SH
