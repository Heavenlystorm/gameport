name: Track B verification
on:
  push:
    branches: [verify-track-b]
permissions:
  contents: read
jobs:
  d3d12:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: GAMEPORT_BUILD="$RUNNER_TEMP/gameport-build" bash Scripts/build-vkd3d-proton.sh
      - run: file "$RUNNER_TEMP"/gameport-build/*/overlay/x86_64-windows/*.dll
